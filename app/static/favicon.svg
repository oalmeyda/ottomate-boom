<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="mine-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </radialGradient>
  </defs>

  <!-- Spikes -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="14" y1="14" x2="50" y2="50" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="50" y2="14" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Mine Body -->
  <circle cx="32" cy="32" r="20" fill="url(#mine-grad)" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Highlight -->
  <circle cx="26" cy="26" r="6" fill="#94a3b8" opacity="0.4"/>
  <circle cx="24" cy="24" r="2.5" fill="#f8fafc" opacity="0.8"/>

  <!-- Fuse -->
  <path d="M 32 12 Q 38 6, 44 8" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Spark -->
  <circle cx="45" cy="8" r="4" fill="url(#spark-grad)"/>
</svg>
