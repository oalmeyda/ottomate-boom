[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ottomate-boom"
version = "0.1.4"
description = "Ottomate Boom: Classic Minesweeper with 3 board sizes, daily deterministic challenges, speed stats, and leaderboards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ottomate-core>=1.29.0,<1.30",
    "fastapi>=0.115,<1",
    "google-auth>=2.38,<3",
    "google-cloud-firestore>=2.20,<3",
    "email-validator>=2.2,<3",
    "requests>=2.32,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "pre-commit>=4.0,<5",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
